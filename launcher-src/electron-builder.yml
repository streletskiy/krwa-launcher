appId: 'ru.krwa.launcher'
productName: 'KRWA Launcher'
artifactName: 'KRWA-Launcher-setup-${version}.${ext}'

copyright: 'streletskiy; based on Helios Launcher © Daniel Scalzi'

publish:
  provider: 'generic'
  url: 'https://mc.krwa.ru/downloads/'

asar: true
compression: 'maximum'

files:
  - '!{dist,dist-linux,dist-mac,tests,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'
  - '!dist*/**/*'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  # Local unsigned build: avoids winCodeSign extraction requiring Windows symlink privileges.
  # Remove this line when a code-signing certificate/build runner is configured.
  signAndEditExecutable: false
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: 'build/icon.ico'
  uninstallerIcon: 'build/icon.ico'
  installerHeaderIcon: 'build/icon.ico'

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch: 'universal'
    - target: 'zip'
      arch: 'universal'
  artifactName: 'KRWA-Launcher-${version}-mac-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux:
  target:
    - target: 'AppImage'
      arch: 'x64'
    - target: 'deb'
      arch: 'x64'
  syncDesktopName: true
  artifactName: 'KRWA-Launcher-${version}-${arch}.${ext}'
  maintainer: 'streletskiy'
  vendor: 'streletskiy'
  synopsis: 'KRWA Minecraft Launcher'
  description: 'Лаунчер KRWA: автоматически устанавливает игру, NeoForge и моды.'
  category: 'Game'

# Keep the default Electron package dependencies and add ALSA, which is
# required by the bundled binary even on a minimal Ubuntu installation.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - 'libasound2t64 | libasound2'


directories:
  buildResources: 'build'
  output: 'dist'
