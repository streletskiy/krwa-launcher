<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Офлайн-миры · KRWA</title>
        <link rel="stylesheet" href="/api/offline-worlds/assets/admin.css" />
        <script defer src="/api/offline-worlds/assets/admin.js"></script>
    </head>
    <body>
        <main>
            <nav>
                <h1>Офлайн-миры</h1><button id="refresh">Обновить</button>
            </nav>
            <p role="status" id="status"></p>
            <section id="auth-state" hidden><h2 id="auth-title">Войдите как администратор</h2><a target="_top" id="login-link" href="/login">Войти</a></section>
            <div id="workspace" hidden>
            <section>
                <h2>Доступ игроков</h2>
                <form id="grant">
                    <label
                        >Игровой ник
                        <input
                            id="grant-name"
                            required
                            maxlength="16"
                            autocomplete="off"
                    /></label>
                    <p id="world-note">Игрок получит весь мир со всеми сохранёнными измерениями.</p><button>Разрешить доступ</button>
                </form>
                <div id="users"></div>
            </section>
            <section>
                <h2>Поездки</h2>
                <div id="trips"></div>
            </section>
            <section id="review" hidden>
                <h2 id="review-title">Сравнение</h2>
                <p id="coordinates"></p>
                <p id="merge-summary"></p>
                <div class="actions">
                    <button id="merge">Автослияние</button><button id="accept">Принять все конфликты игрока</button
                    ><button id="accept-existing" hidden>Применить всё, кроме новых чанков</button
                    ><button id="revise">Вернуть игроку на доработку</button
                    ><button id="keep">Оставить мир сервера</button>
                </div>
                <div id="confirm" hidden>
                    <p id="question"></p>
                    <button id="confirm-action">Подтвердить</button
                    ><button id="cancel">Отмена</button>
                </div>
                <div id="dimensions" role="group" aria-label="Измерение" hidden></div>
                <details id="map-tools"><summary>Карта и срезы по координатам</summary><div id="map"></div>
                    <div id="slices" hidden><div id="slice-heading"></div><label>Высота Y <input id="slice-y" type="number" min="-64" max="319"></label><div id="slice-images"></div></div>
                </details>
                <div><div>
                        <h3>Изменения</h3>
                        <div class="toolbar">
                            <select id="filter" aria-label="Тип изменений">
                                <option value="">Все изменения</option>
                                <option value="conflict">Конфликты</option>
                                <option value="manual">Ручной перенос</option>
                                <option value="auto">
                                    Совместимые
                                </option></select
                            ><button id="all">Все чанки</button>
                        </div>
                        <div id="comparison"></div>
                        <button id="more" hidden>Показать ещё</button>
                    </div>
                </div>
                <details><summary>Архивы для ручного переноса</summary><div id="exports"></div></details>
            </section>
            </div>
        </main>
    </body>
</html>
